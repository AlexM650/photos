<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Grid</title>
    <meta name="description" content="A responsive 3x3 photo grid displaying nine equal dimension photos with images and titles." />
    <meta property="og:title" content="Photo Grid" />
    <meta property="og:description" content="A responsive 3x3 photo grid displaying nine equal dimension photos with images and titles." />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #0a0a0a;
        color: #ededed;
        min-height: 100vh;
        padding: 48px 16px;
      }
      .container {
        max-width: 1024px;
        margin: 0 auto;
      }
      .gallery-header {
        text-align: center;
        margin-bottom: 40px;
      }
      .gallery-title {
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: #ffffff;
      }
      .gallery-subtitle {
        margin-top: 8px;
        font-size: 0.875rem;
        color: #a3a3a3;
      }
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(1, minmax(0, 1fr));
        gap: 24px;
      }
      @media (min-width: 640px) {
        .photo-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (min-width: 768px) {
        .photo-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      .photo-card {
        background-color: #171717;
        border: 1px solid #262626;
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .photo-card:hover {
        border-color: #404040;
      }
      .photo-container {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        background-color: #262626;
      }
      .photo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
      }
      .photo-card:hover .photo-img {
        transform: scale(1.05);
      }
      .photo-meta {
        padding: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .photo-title {
        font-size: 0.95rem;
        font-weight: 500;
        color: #e5e5e5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .photo-badge {
        font-size: 0.75rem;
        color: #a3a3a3;
        background-color: rgba(38, 38, 38, 0.8);
        padding: 2px 8px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased min-h-screen">
    <div id="root">
      <div id="app-root" class="min-h-screen bg-neutral-950 text-neutral-100 py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-5xl mx-auto container">
          <header id="gallery-header" class="mb-10 text-center gallery-header">
            <h1 id="gallery-title" class="text-3xl font-semibold tracking-tight text-white sm:text-4xl gallery-title">
              Photo Gallery
            </h1>
            <p id="gallery-subtitle" class="mt-2 text-sm text-neutral-400 gallery-subtitle">
              A curated 3×3 grid of nine equal-dimension photographs
            </p>
          </header>

          <main id="photo-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 photo-grid">
            <!-- Row 1, Column 1 -->
            <article id="photo-card-1" class="group bg-neutral-900 rounded-xl overflow-hidden border border-neutral-800 hover:border-neutral-700 transition-all duration-200 flex flex-col shadow-sm photo-card">
              <div id="photo-container-1" class="relative aspect-square w-full overflow-hidden bg-neutral-800 photo-container">
                <img
                  id="photo-img-1"
                  src="/baseball-glove.jpg"
                  alt="Glove"
                  loading="lazy"
                  referrerPolicy="no-referrer"
                  class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300 photo-img"
                />
              </div>
              <div id="photo-meta-1" class="p-4 flex items-center justify-between photo-meta">
                <h2 id="photo-title-1" class="text-base font-medium text-neutral-200 group-hover:text-white truncate photo-title">
                  Glove
                </h2>
                <span id="photo-badge-1" class="text-xs text-neutral-400 bg-neutral-800/80 px-2 py-0.5 rounded photo-badge">
                  Baseball
                </span>
              </div>
            </article>

</html>
